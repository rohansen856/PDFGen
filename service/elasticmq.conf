include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Single-document requests: user is waiting on the other end.
  pdf-high {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "pdf-dlq", maxReceiveCount = 6 }
  }
  # Bulk documents: throughput over latency.
  pdf-low {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "pdf-dlq", maxReceiveCount = 6 }
  }
  pdf-dlq {}
}
